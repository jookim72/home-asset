<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우리집자산">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>우리집 자산관리</title>
<style>
:root{
  --bg:#f3f5f7;--bg2:#f8fafb;--card:#ffffff;--ink:#14202b;--sub:#5d6b78;--mute:#8a96a1;--line:#e3e8ee;
  --accent:#0f766e;--accent-ink:#ffffff;--accent-soft:#e2f3f0;--warn:#b45309;--warn-soft:#fff3e2;
  --neg:#c0352b;--pos:#0f7a3d;--hero1:#0f3d3a;--hero2:#0f766e;--shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.04);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1318;--bg2:#141b22;--card:#161e26;--ink:#e6ecf1;--sub:#9aa8b4;--mute:#6f7d89;--line:#24303b;
    --accent:#2cc2b0;--accent-ink:#06201d;--accent-soft:#12302d;--warn:#f0a44b;--warn-soft:#2e2414;
    --neg:#ff7b70;--pos:#4ad08a;--hero1:#0b2a28;--hero2:#0f5a54;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1318;--bg2:#141b22;--card:#161e26;--ink:#e6ecf1;--sub:#9aa8b4;--mute:#6f7d89;--line:#24303b;
  --accent:#2cc2b0;--accent-ink:#06201d;--accent-soft:#12302d;--warn:#f0a44b;--warn-soft:#2e2414;
  --neg:#ff7b70;--pos:#4ad08a;--hero1:#0b2a28;--hero2:#0f5a54;--shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button{font:inherit;color:inherit}
.num,td,.kpi b,.big{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:18px;margin:0;letter-spacing:-.02em}
.top .lock{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px;white-space:nowrap}
.top .lock svg{width:14px;height:14px}
main{max-width:1180px;margin:0 auto;padding:14px 16px 28px}
h2.sec{font-size:15px;margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2.sec:first-child{margin-top:4px}
h3{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi span{display:block;font-size:12px;color:var(--sub)}
.kpi b{display:block;font-size:17px;margin-top:2px;letter-spacing:-.02em;word-break:keep-all}
.kpi small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
@media(min-width:720px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.kpis.k4{grid-template-columns:repeat(4,1fr)}}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border:0}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:2px 0 6px;line-height:1.2;word-break:keep-all}
.hero .row{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;opacity:.92}
.hero .row b{font-weight:600}
.hero .delta{display:inline-block;margin-top:8px;font-size:12px;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:999px}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.danger{color:var(--neg)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.item:active{transform:scale(.995)}
.item .l{min-width:0}
.item .t{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:12px;color:var(--sub);margin-top:2px}
.item .r{text-align:right;flex-shrink:0}
.item .v{font-weight:700;font-size:15px}
.item .s{font-size:12px;color:var(--sub);margin-top:2px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px;font-size:13px;color:var(--sub)}
.grp-h b{color:var(--ink);font-size:14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:1px}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.gray{background:var(--bg2);color:var(--sub);border:1px solid var(--line)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.prog{height:5px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent)}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:10px;font-size:13px}
.bar-row .bar{height:10px;background:var(--bg2);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.bar-row .bar i{display:block;height:100%;border-radius:9px}
.bar-row b{font-weight:600;min-width:84px;text-align:right}
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.legend{display:grid;gap:6px;font-size:13px;flex:1;min-width:180px}
.legend div{display:flex;justify-content:space-between;gap:8px}
.legend span{color:var(--sub)}
.chart{width:100%;min-height:40px}
.chart svg{display:block}
.chart text{font-size:11px;fill:var(--mute);font-family:inherit}
.alerts{display:grid;gap:8px}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:14px}
.alert .dd{font-weight:700;font-size:13px;white-space:nowrap}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:22px 16px}
.welcome h2{margin:0 0 6px;font-size:20px}
.welcome p{margin:0;color:var(--sub)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th{font-weight:600;color:var(--sub);text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);font-size:12px;position:sticky;top:0;background:var(--card)}
td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
tr.hl td{background:var(--accent-soft)}
td.tot{font-weight:700}
details.card summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"펼치기";font-size:12px;color:var(--sub);font-weight:400}
details.card[open] summary::after{content:"접기"}
details.card[open] summary{margin-bottom:10px}
.note{font-size:12px;color:var(--sub);line-height:1.6}
.note ul{margin:6px 0 0;padding-left:18px}
.kv{display:grid;gap:6px;font-size:14px}
.kv div{display:flex;justify-content:space-between;gap:10px}
.kv span{color:var(--sub)}
.kv .sum{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-weight:700}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--sub);font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.full{display:flex}.seg.full button{flex:1}
/* forms */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{grid-column:1/-1;display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.half{grid-column:auto}
.fld .lab{font-size:12px;color:var(--sub);font-weight:600}
.fld small{font-size:11px;color:var(--mute)}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;-webkit-appearance:none;appearance:none}
.fld select{background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.fld textarea{min-height:64px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.unit-in{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px}
.unit-in:focus-within{outline:2px solid var(--accent);outline-offset:-1px}
.unit-in input{border:0!important;outline:none!important;background:transparent!important;text-align:right}
.unit-in span{padding:0 12px 0 2px;color:var(--sub);font-size:13px;white-space:nowrap}
.chk{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
fieldset.fs{margin:0;min-width:0}
fieldset.fs legend{font-weight:700;font-size:15px;padding:0 4px}
.sub-h{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--accent);margin-top:4px;border-top:1px dashed var(--line);padding-top:10px}
.hidden{display:none!important}
@media(max-width:350px){.fld.half{grid-column:1/-1}}
/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(5,10,15,.45)}
.sheet-panel{position:relative;background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:6px 16px calc(16px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);padding:10px 0;z-index:2}
.sheet-head h3{margin:0;font-size:17px}
.sheet-actions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
.sheet-actions .primary{flex:1}
@media(min-width:700px){.sheet{align-items:center}.sheet-panel{border-radius:20px;max-height:86vh}}
/* nav */
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.nav button{flex:1;border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);cursor:pointer;font-weight:600}
nav.nav button svg{width:22px;height:22px}
nav.nav button.on{color:var(--accent)}
@media(min-width:900px){
  body{padding-bottom:0;padding-left:84px}
  nav.nav{top:0;right:auto;width:84px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding-top:84px;gap:6px}
  nav.nav button{flex:0;padding:10px 4px}
}
/* future layout */
.fut-grid{display:grid;gap:14px;align-items:start}
.pane-set{display:grid;gap:12px}
@media(max-width:899px){.fut-grid[data-seg="result"] .pane-set,.fut-grid[data-seg="set"] .pane-res{display:none}}
@media(min-width:900px){.fut-grid{grid-template-columns:minmax(330px,400px) 1fr}.seg-fut{display:none!important}.pane-set{position:sticky;top:70px;max-height:calc(100vh - 84px);overflow-y:auto;padding-right:4px}}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.calcbox{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--sub)}
.calcbox .kv{font-size:13px}
.calcbox .kv b{color:var(--ink)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <h1>우리집 자산관리</h1>
  <div class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>이 기기에만 저장</div>
</div></header>
<main id="main"></main>
<nav class="nav">
  <button data-nav="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>현황</button>
  <button data-nav="fin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>금융자산</button>
  <button data-nav="re"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>부동산</button>
  <button data-nav="fut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/><path d="M15 6h5v5"/></svg>미래전망</button>
  <button data-nav="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>
</nav>
<div id="sheet" class="sheet hidden">
  <div class="sheet-bg" data-act="close"></div>
  <div class="sheet-panel">
    <div class="sheet-head"><h3 id="sheetTitle"></h3><button class="btn ghost sm" data-act="close" type="button">닫기</button></div>
    <form id="sheetForm" autocomplete="off"></form>
  </div>
</div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============ 기본 설정 ============ */
const KEY='homeAssetMgr.v1';
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const FIN={
  deposit:{label:'예적금',color:'#4f7cff',subs:['일반(수시입출)','정기예금','적금']},
  pension:{label:'연금',color:'#8b5cf6',subs:['국민연금','퇴직연금/IRP','개인연금']},
  isa:{label:'ISA',color:'#14b8a6',subs:['중개형','신탁형','일임형']},
  stock:{label:'주식/ETF',color:'#f59e0b',subs:['국내주식','해외주식','ETF']},
  els:{label:'ELB/ELS',color:'#ec4899',subs:['ELB','ELS']},
  etc:{label:'기타',color:'#94a3b8',subs:['기타']}
};
const C_RE='#22a06b', C_LEASE='#64748b';
const C_SRC={fin:'#4f7cff',nps:'#8b5cf6',rent:'#22a06b',work:'#f59e0b'};
const isNps=it=>it.cat==='pension'&&it.sub==='국민연금';
const isSav=it=>it.cat==='deposit'&&it.sub==='적금';
const pd=s=>{const d=new Date(String(s||'')+'T00:00:00');return isNaN(d)?null:d};
const monthsBetween=(a,b)=>(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
// 적금: 가입일·만기일·월 납입액으로 오늘까지 납입한 금액을 자동 계산
function savInfo(i){
  const s=pd(i.start);if(!s||!num(i.monthly))return null;
  const t=new Date();t.setHours(0,0,0,0);
  const m=num(i.monthly),r=num(i.rate)/100,mat=pd(i.maturity);
  const total=mat&&mat>s?Math.max(1,monthsBetween(s,mat)):null;
  let n=t<s?0:monthsBetween(s,t)+(t.getDate()>=s.getDate()?1:0);
  if(total!=null)n=Math.min(n,total);n=Math.max(0,n);
  const matInt=total?m*r*total*(total+1)/2/12:null;
  return{n,total,paid:m*n,matInt,matAmt:total?m*total+matInt:null};
}
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function addYears(s,n){const d=pd(s);if(!d)return '';d.setFullYear(d.getFullYear()+n);return ymd(d)}
// ISA 의무가입 종료일: 입력값이 없으면 가입일 + 3년
const isaMand=i=>i.cat==='isa'?(i.mandEnd||addYears(i.start,3)):'';
const dotDate=s=>String(s||'').replace(/-/g,'.');
// 주식/ETF: 평균매입단가(원) × 보유수량 = 매수금액, 현재가(원) × 보유수량 = 평가금액 (만원 단위로 환산)

const stockEval=i=>isStock(i)&&num(i.curPrice)>0&&num(i.qty)>0?num(i.curPrice)*num(i.qty)/10000:null;
const wonRaw=v=>Number(v).toLocaleString('ko-KR',{maximumFractionDigits:2})+'원';
function finVal(i){const s=isSav(i)?savInfo(i):null;if(s)return s.paid;const e=stockEval(i);return e!=null?e:num(i.value)}
function finPrin(i){if(isSav(i)&&savInfo(i))return finVal(i);const b=stockBuy(i);if(b!=null)return b;return (i.principal===''||i.principal==null)?finVal(i):num(i.principal)}

function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))merge(a[k],b[k]);else a[k]=b[k];}return a}

function won(v){ // 만원 단위 입력
  if(v==null||!isFinite(v))return '-';
  const neg=v<0;let a=Math.round(Math.abs(v));if(a===0)return '0원';
  const e=Math.floor(a/10000),m=a%10000;let s='';
  if(e)s+=e.toLocaleString('ko-KR')+'억';
  if(m)s+=(e?' ':'')+m.toLocaleString('ko-KR')+'만';
  return (neg?'-':'')+s+'원';
}
function short(v){const a=Math.abs(v);if(a>=10000){const x=v/10000;return (a>=100000?Math.round(x):Math.round(x*10)/10)+'억'}return Math.round(v).toLocaleString('ko-KR')+'만'}
const pc=(v,d=1)=>(isFinite(v)?v.toFixed(d):'0')+'%';
function today0(){const d=new Date();d.setHours(0,0,0,0);return d}
function dday(s){if(!s)return null;const d=new Date(s+'T00:00:00');if(isNaN(d))return null;return Math.round((d-today0())/86400000)}
function ddTxt(d){return d==null?'':d>0?'D-'+d:d===0?'D-Day':(-d)+'일 지남'}
function ownerName(k){return k==='sp'?(S.members.sp.name||'배우자'):k==='joint'?'공동':(S.members.me.name||'본인')}
const ownerOpts=()=>[['me',ownerName('me')],['sp',ownerName('sp')],['joint','공동']];
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,p,v){const ks=p.split('.');const last=ks.pop();ks.reduce((a,k)=>a[k],o)[last]=v}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2000)}

/* ============ 현재 자산 계산 ============ */
function calc(){
  const byCat={};Object.keys(FIN).forEach(k=>byCat[k]=0);
  let fin=0,principal=0,wsum=0,npsPaid=0;const owner={me:0,sp:0,joint:0};
  S.fin.forEach(i=>{
    const v=finVal(i);
    if(isNps(i)){npsPaid+=v;return}
    byCat[i.cat]=(byCat[i.cat]||0)+v;fin+=v;
    principal+=finPrin(i);
    wsum+=v*num(i.rate);owner[i.owner||'me']+=v;
  });
  let reVal=0,loans=0,tenantDep=0,leaseDep=0,rentIn=0,rentOut=0;
  S.re.forEach(r=>{
    const o=r.owner||'me';
    if(r.kind!=='lease'){
      reVal+=num(r.value);loans+=num(r.loan);
      let eq=num(r.value)-num(r.loan);
      if(r.use==='rent'){tenantDep+=num(r.deposit);rentIn+=num(r.rent);eq-=num(r.deposit)}
      owner[o]+=eq;
    }else{
      leaseDep+=num(r.deposit);loans+=num(r.loan);rentOut+=num(r.rent);
      owner[o]+=num(r.deposit)-num(r.loan);
    }
  });
  const assets=fin+reVal+leaseDep,liab=loans+tenantDep;
  return{byCat,fin,principal,gain:fin-principal,wr:fin?wsum/fin:0,npsPaid,reVal,loans,tenantDep,leaseDep,rentIn,rentOut,assets,liab,net:assets-liab,owner};
}
function alerts(){
  const L=[];
  S.re.forEach(r=>{if((r.kind==='lease'||r.use==='rent')&&r.cEnd){const d=dday(r.cEnd);if(d!=null&&d<=180)L.push({d,t:r.name,s:r.kind==='lease'?'전월세 계약 만료':'임대 계약 만료'})}});
  S.fin.forEach(i=>{if(i.maturity&&!isNps(i)){const d=dday(i.maturity);if(d!=null&&d<=180)L.push({d,t:i.name,s:FIN[i.cat].label+' 만기'})}});
  S.fin.forEach(i=>{const m=isaMand(i);if(m){const d=dday(m);if(d!=null&&d>=-30&&d<=180)L.push({d,t:i.name,s:'ISA 의무가입기간 종료'})}});
  return L.sort((a,b)=>a.d-b.d);
}

/* ============ 미래 예측 ============ */
function defNpsAge(by){return by<=1952?60:by<=1956?61:by<=1960?62:by<=1964?63:by<=1968?64:65}
const okBirth=b=>/^\d{4}-\d{2}$/.test(b||'');
function salaryPath(m,Y0,M0,endY){
  const by=+m.birth.slice(0,4),bm=+m.birth.slice(5,7)||1;
  const retAge=num(m.retireAge)||60,retY=by+retAge,retM=bm;
  const pk=num(m.peakYears),P=pk>0?retY-pk:Infinity;
  const ratio=(m.peakRatio===''||m.peakRatio==null?100:num(m.peakRatio))/100,decl=num(m.peakDecline)/100,raise=num(m.raise)/100;
  const sal={};let s=num(m.salary);
  for(let y=Y0;y<=Math.min(retY,endY);y++){
    if(y>Y0){s=y>=P?(y===P?s*ratio:s*(1-decl)):s*(1+raise)}
    let f=1;
    if(y===Y0)f=(12-M0+1)/12;
    if(y===retY)f=(y===Y0)?Math.max(0,retM-M0+1)/12:retM/12;
    sal[y]={full:s,f,gross:m.working===false?0:s*f};
  }
  return{by,bm,retY,retM,retAge,peakY:pk>0?P:null,sal};
}
function project(){
  const o=S.outlook,now=new Date(),Y0=now.getFullYear(),M0=now.getMonth()+1;
  const me={key:'me',...S.members.me};
  if(!okBirth(me.birth))return{ok:false,msg:'<b>가정 설정</b>에서 본인 출생년월과 연간 급여를 입력하면 은퇴 후 예상 월 수령액이 계산됩니다.'};
  const ms=[me];let warn='';
  if(S.members.sp.enabled){if(okBirth(S.members.sp.birth))ms.push({key:'sp',...S.members.sp});else warn='배우자 출생년월이 없어 배우자 소득은 계산에서 제외했습니다.'}
  const infl=num(o.inflation)/100,r=num(o.investReturn)/100,rg=num(o.rentGrowth)/100,reg=num(o.reGrowth)/100,nr=(o.netRate===''?100:num(o.netRate))/100,r2=num(o.postReturn)/100;
  const c=calc();
  const rentBase=(o.rentAnnual===''||o.rentAnnual==null)?c.rentIn*12:num(o.rentAnnual);
  const meBy=+me.birth.slice(0,4);
  const endY=meBy+(num(o.endAge)||90);
  const paths=ms.map(m=>({m,...salaryPath(m,Y0,M0,endY)}));
  let startY=o.basis==='both'?Math.max(...paths.map(p=>p.retY))+1:paths[0].retY+1;
  if(startY<Y0)startY=Y0;
  const D=y=>Math.pow(1+infl,y-Y0);
  // 적립기
  let bal=c.fin;const acc=[];const sums={net:0,rent:0,ret:0,dc:0,spend:0};
  for(let y=Y0;y<startY;y++){
    const f=y===Y0?(12-M0+1)/12:1,t=y-Y0;
    const gross=paths.reduce((a,p)=>a+(p.sal[y]?p.sal[y].gross:0),0);
    const net=gross*nr,dc=o.dcAccrual?gross/12:0;
    const rent=rentBase*Math.pow(1+rg,t)*f,spend=num(o.spending)*Math.pow(1+infl,t)*f;
    const ret=bal*r*f;
    bal=bal+ret+net+rent+dc-spend;
    sums.net+=net;sums.rent+=rent;sums.ret+=ret;sums.dc+=dc;sums.spend+=spend;
    acc.push({y,ages:paths.map(p=>y-p.by),gross,net,rent,dc,spend,ret,save:net+rent+dc-spend,bal});
  }
  const balStart=bal;
  // 국민연금
  const nps=paths.map(p=>{
    const items=S.fin.filter(i=>isNps(i)&&((i.owner||'me')===p.m.key||(p.m.key==='me'&&i.owner==='joint')));
    const monthly=items.reduce((a,i)=>a+num(i.npsMonthly),0);
    const age=items.find(i=>num(i.npsAge))?num(items.find(i=>num(i.npsAge)).npsAge):defNpsAge(p.by);
    return{monthly,age,y:p.by+age};
  });
  // 인출기
  const n=Math.max(1,endY-startY+1),g=o.mode==='indexed'?infl:0,q=(1+g)/(1+r2);
  const W0=balStart<=0?0:(Math.abs(r2-g)<1e-9?balStart/n:balStart*(r2-g)/((1+r2)*(1-Math.pow(q,n))));
  const pay=[];let pb=balStart;
  for(let y=startY;y<=Math.max(endY,startY);y++){
    const t=y-startY;
    const fin=pb>0?W0*Math.pow(1+g,t):0;
    const np=paths.reduce((a,p,i)=>a+((y-p.by)>=nps[i].age?nps[i].monthly*12*D(y):0),0);
    const rent=rentBase*Math.pow(1+rg,y-Y0);
    const work=paths.reduce((a,p)=>a+(p.sal[y]?p.sal[y].gross*nr:0),0);
    pay.push({y,ages:paths.map(p=>y-p.by),bal0:pb,fin,nps:np,rent,work});
    pb=Math.max(0,(pb-fin)*(1+r2));
  }
  const reEqStart=c.reVal*Math.pow(1+reg,startY-Y0)-c.loans-c.tenantDep+c.leaseDep;
  const npsYears=nps.filter(x=>x.monthly>0).map(x=>x.y);
  const fullY=npsYears.length?Math.max(startY,...npsYears):startY;
  return{ok:true,warn,Y0,M0,infl,D,startY,endY,n,meBy,paths,acc,pay,sums,balStart,finNow:c.fin,W0,nps,rentBase,reEqStart,fullY,spending:num(o.spending)};
}

/* ============ 차트 ============ */
function niceStep(r){if(!(r>0))return 1;const e=Math.pow(10,Math.floor(Math.log10(r)));const f=r/e;return(f<=1?1:f<=2?2:f<=5?5:10)*e}
function axis(lo,hi){let st=niceStep((hi-lo)/4);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;if(hi===lo)hi=lo+st;const t=[];for(let v=lo;v<=hi+st/2;v+=st)t.push(v);return{lo,hi,t}}
function lineSVG(w,labels,ys,{h=210,mark=null,markTxt='',color='var(--accent)'}={}){
  if(!ys.length)return '';
  const pl=46,pr=12,pt=16,pb=24,iw=w-pl-pr,ih=h-pt-pb;
  const ax=axis(Math.min(0,...ys),Math.max(...ys,1));
  const X=i=>pl+(ys.length<2?iw/2:i*iw/(ys.length-1)),Y=v=>pt+ih-(v-ax.lo)/(ax.hi-ax.lo)*ih;
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">`;
  ax.t.forEach(v=>{s+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${short(v)}</text>`});
  const step=Math.max(1,Math.ceil(labels.length/Math.max(2,Math.floor(iw/58))));
  labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1&&labels.length<6)s+=`<text x="${X(i)}" y="${h-6}" text-anchor="middle">${l}</text>`});
  if(mark!=null&&mark>=0){s+=`<line x1="${X(mark)}" x2="${X(mark)}" y1="${pt}" y2="${pt+ih}" stroke="var(--warn)" stroke-dasharray="4 3"/><text x="${X(mark)+4}" y="${pt+10}" style="fill:var(--warn);font-weight:600">${markTxt}</text>`}
  const pts=ys.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  s+=`<path d="M${pts[0]} L${pts.join(' L')} L${X(ys.length-1).toFixed(1)},${Y(Math.max(ax.lo,0))} L${X(0).toFixed(1)},${Y(Math.max(ax.lo,0))} Z" fill="${color}" opacity=".12"/>`;
  s+=`<path d="M${pts.join(' L')}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>`;
  if(ys.length<=24)ys.forEach((v,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${color}"/>`});
  return s+'</svg>';
}
function stackSVG(w,labels,stacks,{h=230}={}){
  const pl=46,pr=10,pt=12,pb=24,iw=w-pl-pr,ih=h-pt-pb,n=labels.length;
  const tot=labels.map((_,i)=>stacks.reduce((a,s)=>a+Math.max(0,s.vals[i]),0));
  const ax=axis(0,Math.max(...tot,1));
  const bw=iw/n,Y=v=>pt+ih-(v-ax.lo)/(ax.hi-ax.lo)*ih;
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">`;
  ax.t.forEach(v=>{s+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${short(v)}</text>`});
  labels.forEach((l,i)=>{
    let acc=0;const x=pl+i*bw+bw*.14,bwi=Math.max(1.5,bw*.72);
    stacks.forEach(st=>{const v=Math.max(0,st.vals[i]);if(v<=0)return;s+=`<rect x="${x.toFixed(1)}" y="${Y(acc+v).toFixed(1)}" width="${bwi.toFixed(1)}" height="${(Y(acc)-Y(acc+v)).toFixed(1)}" fill="${st.color}"/>`;acc+=v});
  });
  const step=Math.max(1,Math.ceil(n/Math.max(2,Math.floor(iw/58))));
  labels.forEach((l,i)=>{if(i%step===0)s+=`<text x="${pl+i*bw+bw/2}" y="${h-6}" text-anchor="middle">${l}</text>`});
  return s+'</svg>';
}
function donutSVG(items,size=168){
  const tot=items.reduce((a,b)=>a+b.value,0)||1,r=size/2-16,C=2*Math.PI*r,cx=size/2;
  let off=0,s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--bg2)" stroke-width="22"/>`;
  items.forEach(it=>{const len=it.value/tot*C;s+=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${it.color}" stroke-width="22" stroke-dasharray="${Math.max(0,len-1.2).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cx})"/>`;off+=len});
  return s+`<text x="${cx}" y="${cx-4}" text-anchor="middle" style="font-size:11px;fill:var(--sub)">총자산</text><text x="${cx}" y="${cx+15}" text-anchor="middle" style="font-size:15px;font-weight:700;fill:var(--ink)">${short(tot)}</text></svg>`;
}

  cats.forEach(k=>{
    const items=S.fin.filter(i=>i.cat===k);

    h+=`<div class="grp-h"><b><i class="dot" style="background:${FIN[k].color}"></i>${FIN[k].label}</b><span>${won(sub)}</span></div><div class="list">`;
    items.forEach(i=>{
      let right;
      if(isNps(i)){
        const m=S.members[i.owner==='sp'?'sp':'me'];const by=okBirth(m.birth)?+m.birth.slice(0,4):null;
        right=`<div class="v">월 ${won(num(i.npsMonthly))}</div><div class="s">${num(i.npsAge)||(by?defNpsAge(by):'?')}세부터 · 납부 ${short(num(i.value))}</div>`;
      }else if(isSav(i)&&savInfo(i)){
        const si=savInfo(i),dd=i.maturity?dday(i.maturity):null;
        right=`<div class="v">${won(si.paid)}</div><div class="s">납입 ${si.n}/${si.total||'?'}회 · 연 ${num(i.rate)}%${dd!=null?` <span class="badge ${dd<=60?'warn':'gray'}">만기 ${ddTxt(dd)}</span>`:''}</div>${si.matAmt!=null?`<div class="s">만기 예상 ${won(si.matAmt)} (이자 ${won(si.matInt)}, 세전)</div>`:''}`;
      }else{
        const v=finVal(i),pr=finPrin(i),g=v-pr;
        const dd=i.maturity?dday(i.maturity):null;
        right=`<div class="v">${won(v)}</div><div class="s">${pr&&g?`<span class="${g>=0?'pos':'neg'}">${g>=0?'+':''}${pc(g/pr*100)}</span> · `:''}${i.rate!==''&&i.rate!=null?'연 '+num(i.rate)+'%':''}${dd!=null?` <span class="badge ${dd<=60?'warn':'gray'}">만기 ${ddTxt(dd)}</span>`:''}</div>`;
        const mand=isaMand(i);
        if(mand){const md=dday(mand);right+=`<div class="s">의무가입 ${dotDate(mand)}까지 ${md!=null&&md<=0?'<span class="badge">기간 충족</span>':`<span class="badge ${md<=90?'warn':'gray'}">의무 ${ddTxt(md)}</span>`}</div>`}
      }
      h+=`<button class="item" data-act="edit-fin" data-id="${i.id}"><div class="l"><div class="t">${esc(i.name)}</div><div class="m">${esc(i.sub||'')}${i.inst?' · '+esc(i.inst):''} · ${esc(ownerName(i.owner))}${num(i.monthly)?' · 월 '+short(num(i.monthly))+' 납입':''}${i.start?' · '+dotDate(i.start)+' 가입':''}${stockBuy(i)!=null?`<br>${num(i.qty).toLocaleString('ko-KR')}주 · 평단 ${wonRaw(num(i.avgPrice))}${num(i.curPrice)>0?' · 현재가 '+wonRaw(num(i.curPrice)):''}<br>투자금액 ${won(stockBuy(i))}`:''}</div></div><div class="r">${right}</div></button>`;
    });
    h+='</div>';
  });
  return h;
}

/* ============ 화면: 부동산 ============ */
function contractBar(r){
  if(!r.cStart||!r.cEnd)return '';
  const a=new Date(r.cStart),b=new Date(r.cEnd),t=today0();
  const p=Math.min(1,Math.max(0,(t-a)/(b-a||1)));const d=dday(r.cEnd);
  return `<div class="note" style="margin-top:8px;display:flex;justify-content:space-between"><span>${r.cStart.replace(/-/g,'.')} ~ ${r.cEnd.replace(/-/g,'.')}</span><span class="badge ${d<=90?'warn':'gray'}">${ddTxt(d)}</span></div><div class="prog"><i style="width:${p*100}%"></i></div>`;
}
function reCard(r){
  const own=r.kind!=='lease';
  let badge,body;
  if(own){
    const rented=r.use==='rent';
    badge=rented?`<span class="badge">${num(r.rent)>0?'월세 임대':'전세 임대'}</span>`:`<span class="badge gray">거주 중</span>`;
    const eq=num(r.value)-num(r.loan)-(rented?num(r.deposit):0);
    const gain=num(r.buyPrice)?num(r.value)-num(r.buyPrice):null;
    body=`<div class="kv" style="margin-top:10px"><div><span>현재 시세</span><b>${won(num(r.value))}</b></div>${gain!=null?`<div><span>취득가 대비</span><b class="${gain>=0?'pos':'neg'}">${gain>=0?'+':''}${won(gain)}</b></div>`:''}${num(r.loan)?`<div><span>담보대출</span><b>-${won(num(r.loan))}</b></div>`:''}${rented?`<div><span>받은 보증금</span><b>-${won(num(r.deposit))}</b></div><div><span>받는 월세</span><b>${won(num(r.rent))}</b></div>`:''}<div class="sum"><span>순자산</span><b>${won(eq)}</b></div></div>${rented?contractBar(r):''}`;
  }else{
    badge=`<span class="badge warn">${num(r.rent)>0?'월세 거주':'전세 거주'}</span>`;
    body=`<div class="kv" style="margin-top:10px"><div><span>낸 보증금</span><b>${won(num(r.deposit))}</b></div>${num(r.rent)?`<div><span>내는 월세</span><b>${won(num(r.rent))}</b></div>`:''}${num(r.loan)?`<div><span>전세대출</span><b>-${won(num(r.loan))}</b></div>`:''}<div class="sum"><span>순자산</span><b>${won(num(r.deposit)-num(r.loan))}</b></div></div>${contractBar(r)}`;
  }
  return `<button class="item" style="display:block" data-act="edit-re" data-id="${r.id}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div class="l"><div class="t">${esc(r.name)}</div><div class="m">${r.addr?esc(r.addr)+' · ':''}${esc(ownerName(r.owner))}</div></div>${badge}</div>${body}</button>`;
}

  else if(d.type==='num')c=`<div class="unit-in"><input name="${d.k}" type="number" inputmode="decimal" step="any" value="${esc(v)}" placeholder="${esc(d.ph||'')}"><span>${d.unit||'만원'}</span></div>`;

$('#sheetForm').addEventListener('submit',e=>{
  e.preventDefault();const it=readForm();

  if(F.type==='fin'&&isStock(it)){
    if((num(it.avgPrice)>0)!==(num(it.qty)>0)){toast('평균매입단가와 보유수량을 함께 입력해 주세요');return}
    if(num(it.curPrice)>0&&!(num(it.qty)>0)){toast('현재가를 쓰려면 보유수량을 입력해 주세요');return}
    const b=stockBuy(it),e=stockEval(it);
    if(b!=null)it.principal=b;
    if(e!=null)it.value=e;
    if(e==null&&it.value===''){toast('현재가 또는 현재 평가금액을 입력해 주세요');return}
  }
  if(F.type==='fin'&&isSav(it)){
    if(!it.start||!num(it.monthly)){toast('적금은 가입일과 월 납입액을 입력해 주세요');return}
    if(it.maturity&&it.maturity<=it.start){toast('만기일이 가입일보다 빠릅니다');return}
    const si=savInfo(it);it.value=si.paid;it.principal=si.paid;
  }
  if(F.type==='fin'&&it.cat==='isa'&&it.start&&it.mandEnd&&it.mandEnd<it.start){toast('의무가입 종료일이 가입일보다 빠릅니다');return}
  if(F.type==='fin'&&it.maturity&&it.start&&it.maturity<=it.start){toast('만기일이 가입일보다 빠릅니다');return}
  if(F.type==='re'&&hasContract(it)&&it.cStart&&it.cEnd&&it.cEnd<it.cStart){toast('계약 종료일이 시작일보다 빠릅니다');return}

});

  const c=calc(),d=new Date(),m=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const s={m,net:c.net,assets:c.assets,liab:c.liab,fin:c.fin,re:c.reVal};
  const i=S.snaps.findIndex(x=>x.m===m);if(i>=0)S.snaps[i]=s;else S.snaps.push(s);
  S.snaps.sort((a,b)=>a.m<b.m?-1:1);save();render();toast(m.replace('-','.')+' 순자산을 기록했습니다');
}
function exportData(){
  const d=new Date(),n=`우리집자산_백업_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  const text=JSON.stringify(S,null,2);
  // 아이패드 홈 화면 앱에서는 공유 시트로 '파일에 저장'·AirDrop 등을 선택하도록 함
  try{
    const file=new File([text],n,{type:'application/json'});
    if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'우리집 자산관리 백업'}).then(()=>toast('백업 파일을 저장했습니다')).catch(err=>{if(err&&err.name!=='AbortError')downloadFile(text,n)});
      return;
    }
  }catch(e){}
  downloadFile(text,n);
}
function downloadFile(text,n){
  const b=new Blob([text],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  toast('백업 파일을 내보냈습니다');
}
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.fin)||!Array.isArray(d.re))throw 0;
    if(!confirm('현재 데이터를 백업 파일 내용으로 바꿀까요?'))return;S=merge(defaults(),d);save();render();toast('백업을 불러왔습니다')}
    catch(err){toast('올바른 백업 파일이 아닙니다')}e.target.value=''};
  r.readAsText(f);
});
function sample(){

    F_({cat:'pension',sub:'국민연금',name:'국민연금',owner:'me',value:9000,npsMonthly:150,npsAge:''}),
    F_({cat:'pension',sub:'국민연금',name:'국민연금',owner:'sp',value:5500,npsMonthly:95,npsAge:''}),
    F_({cat:'pension',sub:'퇴직연금/IRP',name:'퇴직연금 DC',inst:'OO증권',owner:'me',value:15000,principal:13000,rate:5}),
    F_({cat:'pension',sub:'개인연금',name:'연금저축펀드',inst:'OO증권',owner:'me',value:4200,principal:3600,rate:5,monthly:50}),
    F_({cat:'isa',sub:'중개형',name:'ISA 중개형',inst:'OO증권',owner:'sp',value:3800,principal:3400,rate:5,monthly:100,start:d(-2,'03-15'),maturity:d(2,'03-15'),mandEnd:d(1,'03-15')}),
    F_({cat:'stock',sub:'ETF',name:'미국 S&P500 ETF',inst:'OO증권',owner:'me',avgPrice:19000,qty:5000,curPrice:24000,value:12000,principal:9500,rate:6,start:d(-4,'05-02')}),
    F_({cat:'stock',sub:'국내주식',name:'국내 대형주',inst:'OO증권',owner:'me',avgPrice:70000,qty:500,curPrice:60000,value:3000,principal:3500,rate:4,start:d(-2,'08-12')}),
    F_({cat:'els',sub:'ELS',name:'지수형 ELS',inst:'OO증권',owner:'sp',value:5000,principal:5000,rate:6.5,maturity:d(1,'04-10')})
  ];
  S.re=[
    {id:uid(),kind:'own',use:'live',name:'우리집 아파트',addr:'서울 OO구',owner:'joint',value:120000,buyPrice:85000,loan:30000},
    {id:uid(),kind:'own',use:'rent',name:'오피스텔 임대',addr:'경기 OO시',owner:'me',value:30000,buyPrice:27000,loan:0,deposit:2000,rent:110,cStart:d(-1,'03-01'),cEnd:d(1,'02-28'),memo:'임차인 계약 2년'}
  ];
  const now=new Date();
  S.snaps=[-5,-4,-3,-2,-1].map((k,i)=>{const t=new Date(now.getFullYear(),now.getMonth()+k,1);return{m:`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}`,net:142000+i*1300+(i%2?600:-200),assets:0,liab:0,fin:0,re:0}});

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-nav]');if(!t)return;
  if(t.dataset.nav){V.tab=t.dataset.nav;render();window.scrollTo(0,0);return}
  const a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case 'add-fin':openForm('fin');break;
    case 'edit-fin':openForm('fin',S.fin.find(x=>x.id===id));break;
    case 'add-re':openForm('re');break;
    case 'edit-re':openForm('re',S.re.find(x=>x.id===id));break;
    case 'close':closeSheet();break;
    case 'del':if(F&&confirm('이 항목을 삭제할까요?')){const k=F.type==='fin'?'fin':'re';S[k]=S[k].filter(x=>x.id!==F.id);save();closeSheet();render();toast('삭제했습니다')}break;
    case 'filter':V.finFilter=t.dataset.v;render();break;
    case 'seg':V.fut=t.dataset.v;render();window.scrollTo(0,0);break;
    case 'pv':V.pv=t.dataset.v==='1';refreshRes();break;
    case 'snap':snapshot();break;
    case 'weighted':{const w=Math.round(calc().wr*100)/100;S.outlook.investReturn=w;save();const el=document.querySelector('[data-bind="outlook.investReturn"]');if(el)el.value=w;refreshRes();toast('기대수익률 '+w+'% 적용');break}
    case 'export':exportData();break;
    case 'import':$('#importFile').click();break;
    case 'sample':sample();break;
    case 'hide-install':try{localStorage.setItem('homeAssetMgr.hideInstall','1')}catch(e){}render();break;
    case 'clear-snaps':if(confirm('순자산 기록을 모두 지울까요?')){S.snaps=[];save();render()}break;
    case 'reset':if(confirm('모든 데이터를 삭제할까요? 되돌릴 수 없습니다.')&&confirm('정말 삭제할까요? 백업 파일이 있는지 확인하세요.')){S=defaults();save();V.tab='dash';render();toast('초기화했습니다')}break;
  }
});
let bt;
function onBind(e){
  const el=e.target;if(!el.dataset||!el.dataset.bind)return;
  let v;
  if(el.type==='checkbox')v=el.checked;
  else if(el.dataset.type==='num')v=el.value===''?'':parseFloat(el.value);
  else if(el.dataset.type==='bool')v=el.value==='1';
  else v=el.value;
  setPath(S,el.dataset.bind,v);save();
  if(el.dataset.bind==='members.sp.enabled'){const b=$('.sp-body');if(b)b.classList.toggle('hidden',!v)}
  clearTimeout(bt);bt=setTimeout(refreshRes,250);
}
document.addEventListener('input',onBind);document.addEventListener('change',onBind);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&F)closeSheet()});

function render(){
  CH={};
  const v={dash:vDash,fin:vFin,re:vRe,fut:vFut,set:vSet}[V.tab];
  $('#main').innerHTML=(V.tab==='dash'?installBanner():'')+v();
  document.querySelectorAll('[data-nav]').forEach(b=>{if(b.closest('nav'))b.classList.toggle('on',b.dataset.nav===V.tab)});
  drawCharts();
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

const APP_VERSION='1.5.0';
// 아이패드·아이폰 Safari에서 열었을 때 홈 화면 설치 안내
function installBanner(){
  if(isStandalone()||!/^https?:$/.test(location.protocol)||window.top!==window.self)return '';
  try{if(localStorage.getItem('homeAssetMgr.hideInstall'))return ''}catch(e){}
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(!ios)return '';
  return `<section class="card" style="margin-bottom:12px;border-color:var(--accent);background:var(--accent-soft)">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><h3 style="margin:0 0 6px">아이패드에 앱으로 설치하기</h3><button class="btn ghost sm" data-act="hide-install">닫기</button></div>
    <ol class="note" style="margin:0;padding-left:18px;color:var(--ink)"><li>Safari 주소창 옆 <b>공유 버튼</b> → <b>홈 화면에 추가</b> → <b>추가</b></li><li>인터넷이 연결된 상태에서 홈 화면의 <b>우리집자산</b> 아이콘으로 한 번 실행</li><li>설정 탭에서 ‘오프라인 사용: 준비됨’ 확인 → 이후 인터넷 없이 사용</li></ol>
    <p class="note" style="margin:8px 0 0">Safari 화면과 홈 화면 앱은 저장 공간이 다릅니다. 자산 입력은 설치한 앱에서 시작하세요.</p></section>`;
}
function isStandalone(){try{return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}}
function offlineReady(){return !!(navigator.serviceWorker&&navigator.serviceWorker.controller)}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&window.top===window.self){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('새 버전이 준비됐습니다. 앱을 다시 열면 적용됩니다.')})});
    }).catch(()=>{});
  });
  navigator.serviceWorker.addEventListener&&navigator.serviceWorker.addEventListener('controllerchange',()=>{if(V.tab==='set')render()});
}
render();
